name: Nonpublishing public browser check
on:
  push:
    branches: [cloud/actions-public-browser-check-2026-10-16]

permissions:
  contents: read

jobs:
  capture:
    # Preparation pushes do not allocate a runner. The explicit marker is a
    # separate one-time execution step after visibility, policy and quota checks.
    if: >-
      github.repository == 'purryc/ai-daily' &&
      github.event.repository.private == false &&
      contains(github.event.head_commit.message, '[run-public-browser-check]')
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      AI_DAILY_CHROMIUM_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - name: Reuse existing dependencies and runner browser
        run: |
          test -x "$AI_DAILY_CHROMIUM_PATH"
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Capture one allowed public product page
        run: node scripts/public-browser-check.mjs --output "$RUNNER_TEMP/public-browser-check"
      - name: Upload only the public probe artifact
        id: artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: public-browser-check-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/public-browser-check/product.png
            ${{ runner.temp }}/public-browser-check/index.html
            ${{ runner.temp }}/public-browser-check/receipt.json
          if-no-files-found: error
          retention-days: 1
      - name: Record actual artifact receipt
        if: ${{ !cancelled() && steps.artifact.outcome == 'success' }}
        env:
          ARTIFACT_ID: ${{ steps.artifact.outputs.artifact-id }}
          ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
          ARTIFACT_DIGEST: ${{ steps.artifact.outputs.artifact-digest }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs/promises';
          const receipt=JSON.parse(await fs.readFile(process.env.RUNNER_TEMP+'/public-browser-check/receipt.json','utf8'));
          const result={run:process.env.GITHUB_SERVER_URL+'/'+process.env.GITHUB_REPOSITORY+'/actions/runs/'+process.env.GITHUB_RUN_ID,commit:process.env.GITHUB_SHA,captureStatus:receipt.captureStatus,visualReviewStatus:'pending-pixel-review',artifactId:process.env.ARTIFACT_ID,artifactUrl:process.env.ARTIFACT_URL,artifactDigest:process.env.ARTIFACT_DIGEST,publication:false};
          await fs.appendFile(process.env.GITHUB_STEP_SUMMARY,'```json\n'+JSON.stringify(result,null,2)+'\n```\n');
          JS
