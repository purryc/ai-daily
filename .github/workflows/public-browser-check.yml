name: Nonpublishing public browser check
on:
  push:
    branches: [cloud/actions-public-browser-check-2026-10-16]

permissions:
  contents: read

jobs:
  capture:
    # A private or unknown-visibility repository never allocates a runner.
    # Only a deliberate execution-marker push can start this public-only probe.
    if: >-
      github.repository == 'purryc/ai-daily' &&
      github.event.repository.private == false &&
      github.event.repository.visibility == 'public' &&
      contains(github.event.head_commit.message, '[run-public-browser-check]')
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      AI_DAILY_CHROMIUM_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - name: Reuse existing dependencies and runner browser
        run: |
          test -x "$AI_DAILY_CHROMIUM_PATH"
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Capture one allowed public product page
        run: node scripts/public-browser-check.mjs --output "$RUNNER_TEMP/public-browser-check"
      - name: Export bounded public files to log
        if: ${{ !cancelled() }}
        run: node scripts/public-browser-log.mjs emit --input "$RUNNER_TEMP/public-browser-check"
      - name: Record run receipt without artifact storage
        if: ${{ !cancelled() }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs/promises';
          let receipt;
          try {receipt=JSON.parse(await fs.readFile(process.env.RUNNER_TEMP+'/public-browser-check/receipt.json','utf8'));} catch {}
          const result={run:'https://github.com/purryc/ai-daily/actions/runs/'+process.env.GITHUB_RUN_ID,commit:process.env.GITHUB_SHA,captureStatus:receipt?.captureStatus??'setup-failed-no-capture-receipt',visualReviewStatus:'pending-pixel-review',outputMode:'bounded-log-no-artifact',logStep:'Export bounded public files to log',publication:false};
          console.log('PUBLIC_BROWSER_RUN_RECEIPT '+JSON.stringify(result));
          await fs.appendFile(process.env.GITHUB_STEP_SUMMARY,'```json\n'+JSON.stringify(result,null,2)+'\n```\n');
          JS
