name: Public daily browser acceptance
on:
  push:
    branches: [cloud/actions-daily-2026-10-20-public-qa]
permissions:
  contents: read
jobs:
  acceptance:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        evidence: [zh, en]
    if: >-
      github.repository == 'purryc/ai-daily' &&
      github.event.repository.private == false &&
      github.event.repository.visibility == 'public' &&
      contains(github.event.head_commit.message, '[run-ai-daily-public-qa]')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      AI_DAILY_CHROMIUM_PATH: /usr/bin/google-chrome
      QA_EVIDENCE_LOCALE: ${{ matrix.evidence }}
      QA_LIVE_BASE: https://purryc.github.io/ai-daily/
      QA_PUBLIC_COMMIT: d33193f665845adac6348185e30bb36d15578154
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - name: Install pinned dependencies without lifecycle scripts
        run: |
          test -x "$AI_DAILY_CHROMIUM_PATH"
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Install CJK fonts from the configured Ubuntu repositories
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
      - name: Validate content, density, image hashes and bilingual structure
        run: npm run check:static
      - name: Check every page in a sandboxed real browser
        run: npm run check:browser
      - name: Preserve public browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: daily-browser-${{ matrix.evidence }}
          path: ${{ runner.temp }}/daily-qa-${{ matrix.evidence }}/
          retention-days: 3
