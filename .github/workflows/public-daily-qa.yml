name: Public daily browser acceptance
on:
  push:
    branches: [cloud/actions-daily-2026-10-19-public-qa]
permissions:
  contents: read
jobs:
  acceptance:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        evidence: [zh, en]
    if: >-
      github.repository == 'purryc/ai-daily' &&
      github.event.repository.private == false &&
      github.event.repository.visibility == 'public' &&
      contains(github.event.head_commit.message, '[run-ai-daily-public-qa]')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      AI_DAILY_CHROMIUM_PATH: /usr/bin/google-chrome
      QA_EVIDENCE_LOCALE: ${{ matrix.evidence }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - name: Install pinned dependencies without lifecycle scripts
        run: |
          test -x "$AI_DAILY_CHROMIUM_PATH"
          npm ci --ignore-scripts --no-audit --no-fund
          npm run check:static
      - name: Install CJK fonts from the configured Ubuntu repositories
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
      - name: Verify sandbox, capture official docs and check both editions
        run: node qa/check.mjs --output "$RUNNER_TEMP/daily-public-qa"
      - name: Export bounded public screenshots and tested candidate to logs
        if: ${{ !cancelled() }}
        run: node qa/bundle.mjs emit "$RUNNER_TEMP/daily-public-qa"
