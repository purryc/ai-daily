<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Arm AI Portal mechanism</title>
  <desc id="desc">Source-traceable diagram based on Arm's September 8, 2026 announcement and learning paths: discover models, compare performance, deploy through familiar runtimes, and expose agent-ready MCP resources.</desc>
  <rect width="1600" height="900" fill="#f7f4ee"/>
  <rect x="54" y="52" width="1492" height="796" rx="28" fill="#fffdf8" stroke="#1e2a35" stroke-width="3"/>
  <text x="98" y="126" font-family="Arial, sans-serif" font-size="42" font-weight="700" fill="#1e2a35">Arm AI Portal</text>
  <text x="98" y="170" font-family="Arial, sans-serif" font-size="22" fill="#60707c">model discovery → hardware fit → deployment workflow → agent-readable access</text>
  <g font-family="Arial, sans-serif">
    <rect x="96" y="250" width="300" height="410" rx="22" fill="#e9f2f4" stroke="#317b86" stroke-width="3"/>
    <text x="132" y="306" font-size="28" font-weight="700" fill="#1e2a35">1 · Discover</text>
    <text x="132" y="355" font-size="22" fill="#1e2a35">Task and target</text>
    <text x="132" y="390" font-size="22" fill="#1e2a35">model catalogue</text>
    <text x="132" y="455" font-size="20" fill="#317b86">Qwen · Gemma</text>
    <text x="132" y="488" font-size="20" fill="#317b86">YOLO · Whisper</text>
    <text x="132" y="552" font-size="18" fill="#60707c">language · speech</text>
    <text x="132" y="582" font-size="18" fill="#60707c">vision · neural graphics</text>
    <text x="132" y="626" font-size="18" fill="#60707c">Arm cloud / edge / device</text>

    <rect x="470" y="250" width="300" height="410" rx="22" fill="#f5eadc" stroke="#c6793b" stroke-width="3"/>
    <text x="506" y="306" font-size="28" font-weight="700" fill="#1e2a35">2 · Compare</text>
    <text x="506" y="355" font-size="22" fill="#1e2a35">Performance record</text>
    <text x="506" y="410" font-size="20" fill="#c6793b">latency</text>
    <text x="506" y="448" font-size="20" fill="#c6793b">memory</text>
    <text x="506" y="486" font-size="20" fill="#c6793b">size</text>
    <text x="506" y="524" font-size="20" fill="#c6793b">accuracy</text>
    <text x="506" y="585" font-size="18" fill="#60707c">target device + runtime</text>
    <text x="506" y="617" font-size="18" fill="#60707c">must travel with the choice</text>

    <rect x="844" y="250" width="300" height="410" rx="22" fill="#e8efe5" stroke="#668b52" stroke-width="3"/>
    <text x="880" y="306" font-size="28" font-weight="700" fill="#1e2a35">3 · Deploy</text>
    <text x="880" y="355" font-size="22" fill="#1e2a35">Code and runtime</text>
    <text x="880" y="414" font-size="20" fill="#668b52">ExecuTorch</text>
    <text x="880" y="452" font-size="20" fill="#668b52">LiteRT</text>
    <text x="880" y="490" font-size="20" fill="#668b52">ONNX Runtime</text>
    <text x="880" y="552" font-size="18" fill="#60707c">Android · Neoverse</text>
    <text x="880" y="584" font-size="18" fill="#60707c">Raspberry Pi · Hugging Face</text>
    <text x="880" y="626" font-size="18" fill="#60707c">BYOM tooling: soon</text>

    <rect x="1218" y="250" width="270" height="410" rx="22" fill="#eee8f6" stroke="#795c9e" stroke-width="3"/>
    <text x="1254" y="306" font-size="28" font-weight="700" fill="#1e2a35">4 · Agent</text>
    <text x="1254" y="355" font-size="22" fill="#1e2a35">Machine-readable</text>
    <text x="1254" y="390" font-size="22" fill="#1e2a35">resources</text>
    <text x="1254" y="455" font-size="20" fill="#795c9e">MCP access</text>
    <text x="1254" y="493" font-size="20" fill="#795c9e">early access</text>
    <text x="1254" y="552" font-size="18" fill="#60707c">permissions ?</text>
    <text x="1254" y="584" font-size="18" fill="#60707c">audit / rollback ?</text>
    <text x="1254" y="616" font-size="18" fill="#60707c">reproducibility ?</text>
  </g>
  <g stroke="#1e2a35" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M396 455h66"/><path d="M448 437l18 18-18 18"/>
    <path d="M770 455h66"/><path d="M822 437l18 18-18 18"/>
    <path d="M1144 455h66"/><path d="M1196 437l18 18-18 18"/>
  </g>
  <text x="98" y="762" font-family="Arial, sans-serif" font-size="21" fill="#1e2a35">Evidence boundary: Arm official launch + public learning paths. Independent benchmark, complete MCP permissions, and production availability are not established.</text>
  <text x="98" y="800" font-family="Arial, sans-serif" font-size="18" fill="#60707c">Self-drawn, source-traceable visual · 2026-09-08 · developer surface</text>
</svg>
